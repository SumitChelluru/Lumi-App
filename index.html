<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumi</title>
<style>
:root{--panel:#161616;--text:#f2f2f2;--muted:#8a8a8e;--accent:#4da3ff;--track:#3a3a3c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--text);font:15px/1.3 "Avenir Next","Segoe UI",Roboto,system-ui,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;padding:6px 8px}.sp{flex:1}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}.ib:disabled{opacity:.3}.ib:active{background:#222}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#stage{flex:1;min-height:0;position:relative}
#cv,#mk{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain}
#mk{pointer-events:none;display:none}
#hs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;touch-action:none}
#gr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#hist{position:absolute;left:10px;top:10px;width:132px;height:56px;background:rgba(0,0,0,.4);border-radius:6px;pointer-events:none}
#tag{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.55);font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px;display:none}
#panel{display:flex;flex-direction:column;background:var(--panel);border-top:1px solid #262626}
#body{order:1;height:clamp(220px,36vh,330px);overflow-y:auto;padding:0 18px 6px}
#tabs{order:2;display:flex;overflow-x:auto;padding:2px 4px;border-top:1px solid #262626;background:#0d0d0d}
#tabs button{flex:1 0 62px;display:flex;flex-direction:column;align-items:center;gap:3px;color:#7d7d82;font-size:11px;padding:8px 4px;min-height:54px}
#tabs button.on{color:var(--accent)}
.sh{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);z-index:2;padding:4px 0}
.sh b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sh button{color:var(--accent);padding:4px 0 4px 14px;min-height:32px;font-size:14px}
.row{display:grid;grid-template-columns:1fr auto;grid-template-areas:"l o" "i i";gap:0 8px;padding:6px 0 10px;align-items:center}
.row span{grid-area:l;color:#c8c8cc;font-size:14px}.row output{grid-area:o;font-size:14px;min-width:40px;text-align:right}.row input{grid-area:i;margin-top:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:2px;border-radius:2px;outline:none;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.7)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.chips button{background:#262628;border-radius:8px;padding:8px 14px;color:#ddd}.chips button.on{background:var(--accent);color:#000}
.pr{display:flex;gap:10px;overflow-x:auto;padding:6px 0}
.pc{flex:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;gap:6px;align-items:center}
.pc canvas,.pc .add{width:76px;height:76px;border-radius:6px;border:2px solid transparent}
.pc .add{display:grid;place-items:center;border:2px dashed #444;font-size:28px;color:var(--accent)}
.pc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:76px}
.pc.on{color:#fff}.pc.on canvas{border-color:var(--accent)}
#ov{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);gap:10px}
#ov.show{display:flex}#ov img{flex:1;min-height:0;width:100%;object-fit:contain}#ov p{margin:0;color:var(--muted);text-align:center}
#ov div{display:flex;gap:8px}#ov div button{flex:1;background:#262628;border-radius:10px;min-height:44px}#ov #close{background:var(--accent);color:#000}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 300px);background:#2a2a2c;padding:9px 14px;border-radius:10px;font-size:13px;display:none;z-index:30;max-width:90%;text-align:center}
</style>
</head>
<body>
<div id="app">
<header><label id="open" class="ib" style="position:relative" aria-label="Open photo"><input type="file" id="file" accept="image/*" style="position:absolute;inset:0;width:100%;height:100%;opacity:0"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg></label><span class="sp"></span>
<button id="undo" class="ib" aria-label="Undo"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
<button id="redo" class="ib" aria-label="Redo"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
<button id="cmp" class="ib" aria-label="Hold to compare"><svg class="i" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
<button id="exp" class="ib" aria-label="Export"><svg class="i" viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></header>
<main id="stage"><canvas id="cv"></canvas><canvas id="mk"></canvas><svg id="hs"></svg><svg id="gr"></svg><canvas id="hist" width="132" height="56"></canvas><label id="pill" style="position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:#4da3ff;color:#000;font-weight:600;padding:12px 22px;border-radius:999px;overflow:hidden"><span>Open photo</span><input type="file" id="file2" accept="image/*" style="position:absolute;inset:0;opacity:0;width:100%;height:100%"></label><div id="tag">Original</div></main>
<section id="panel"><div id="body"></div><nav id="tabs"></nav></section>
<input type="file" id="pfile" accept=".xmp,.lrtemplate,.dng,.txt" multiple hidden>
<div id="ov"><img id="oimg" alt="Edited photo"><p>Press and hold the photo to save it, or use Share.</p><div><button id="save">Save to gallery</button><button id="share">Share</button><button id="close">Done</button></div></div>
<div id="toast"></div>
</div>

/* ---------- Lightroom preset import (.xmp / .lrtemplate / .dng) ---------- */
function parseLR(t){const g=k=>{const m=t.match(new RegExp('(?:^|[^A-Za-z])'+k+'\\s*=\\s*"?([+-]?[\\d.]+)'));return m?+m[1]:null},first=(...ks)=>{for(const k of ks){const v=g(k);if(v!==null)return v}return null};
const P={};let n=0;const set=(k,v,f=1)=>{if(v!==null&&!isNaN(v)){P[k]=Math.round(v*f*100)/100;n++}};
set('exp',first('Exposure2012','Exposure'));set('con',first('Contrast2012','Contrast'));set('hl',first('Highlights2012'));set('sh',first('Shadows2012'));set('wh',first('Whites2012'));set('bl',first('Blacks2012'));
set('cla',g('Clarity2012'));set('tex',g('Texture'));set('dhz',g('Dehaze'));set('shp',g('Sharpness'),.67);set('vib',g('Vibrance'));set('sat',g('Saturation'));set('grain',g('GrainAmount'));const vg=g('PostCropVignetteAmount');if(vg!==null)set('vig',-vg);
const it=g('IncrementalTemperature'),T=g('Temperature');if(it!==null)set('tmp',it);else if(T!==null)set('tmp',Math.abs(T)>200?Math.max(-100,Math.min(100,(T-5500)/40)):T);
const iv=g('IncrementalTint'),tn=g('Tint');if(iv!==null)set('tint',iv);else if(tn!==null)set('tint',tn*.67);
if(/ConvertToGrayscale\s*=\s*"?(True|true)/.test(t)){P.sat=-100;P.vib=-100;n++}
const HS=newHS();let hsOn=false;BANDS.forEach(([nm],i)=>{[['h','HueAdjustment'],['s','SaturationAdjustment'],['l','LuminanceAdjustment']].forEach(([k,pre])=>{const v=g(pre+nm);if(v){HS[i][k]=v;hsOn=true;n++}})});
const pts=nm=>{let m=t.match(new RegExp('<crs:'+nm+'>([\\s\\S]*?)</crs:'+nm+'>'))||t.match(new RegExp('(?:^|[^A-Za-z])'+nm+'\\s*=\\s*\\{([\\s\\S]*?)\\}'));if(!m)return null;
const a=(m[1].match(/-?\d+(?:\.\d+)?/g)||[]).map(Number),o=[];for(let i=0;i+1<a.length;i+=2)o.push([Math.min(255,Math.max(0,a[i])),Math.min(255,Math.max(0,a[i+1]))]);
if(!o.length)return null;o.sort((x,y)=>x[0]-y[0]);if(o[0][0]>0)o.unshift([0,0]);if(o[o.length-1][0]<255)o.push([255,255]);return o.filter((q,i)=>!i||q[0]-o[i-1][0]>=1)};
const CV=newCV();let cvOn=false;[['rgb','ToneCurvePV2012'],['r','ToneCurvePV2012Red'],['g','ToneCurvePV2012Green'],['b','ToneCurvePV2012Blue']].forEach(([k,nm])=>{const p=pts(nm);if(p&&p.length>=2&&!(p.length===2&&p[0][1]===0&&p[1][1]===255)){CV[k]=p;cvOn=true;n++}});
return n?{V:P,HS:hsOn?HS:null,CV:cvOn?CV:null}:null}
$('pfile').onchange=async e=>{let ok=0,bad=0;for(const f of e.target.files){try{const buf=await f.arrayBuffer();let t=new TextDecoder('latin1').decode(buf);
if(/\.dng$/i.test(f.name)){const a=t.indexOf('<x:xmpmeta'),b=t.lastIndexOf('</x:xmpmeta>');if(a>=0&&b>a)t=t.slice(a,b+12)}
const p=parseLR(t);if(p){p.n=f.name.replace(/\.[^.]+$/,'');UP=UP.filter(x=>x.n!==p.n);UP.push(p);ok++}else bad++}catch(err){bad++}}
saveUP();e.target.value='';toast(ok?`Imported ${ok} preset${ok>1?'s':''}${bad?`, ${bad} unreadable`:''}. Colour grading, noise reduction and lens settings are skipped.`:'No supported settings found in that file');if(ok)buildBody()};

function showGrid(on){const s=$('gr');if(!on){s.innerHTML='';return}const g=geo(),sr=$('stage').getBoundingClientRect(),x0=g.x-sr.left,y0=g.y-sr.top,col=Math.abs(S.crop.ang)<.05?'#4da3ff':'rgba(255,255,255,.55)';let h='';
for(let k=1;k<10;k++){const x=x0+g.w*k/10,y=y0+g.h*k/10;h+=`<line x1="${x}" y1="${y0}" x2="${x}" y2="${y0+g.h}"/><line x1="${x0}" y1="${y}" x2="${x0+g.w}" y2="${y}"/>`}s.innerHTML=`<g stroke="${col}" stroke-width="1">${h}</g>`}
/* ---------- auto tone / auto level ---------- */
function autoTone(){if(!IMG)return;const c=canvasOf(IMG,256),d=c.getContext('2d').getImageData(0,0,c.width,c.height).data,Hh=new Float32Array(256);let n=0,sum=0;
for(let i=0;i<d.length;i+=4){const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];Hh[Math.round(l)]++;n++;sum+=l/255}
const mean=Math.max(.02,sum/n),pc=q=>{let a=0;for(let i=0;i<256;i++){a+=Hh[i];if(a>=q*n)return i/255}return 1};
let e=Math.max(-1.5,Math.min(1.5,2.2*Math.log2(.45/mean)*.7));if(Math.abs(e)<.1)e=0;
const ex=x=>Math.pow(Math.min(Math.pow(x,2.2)*Math.pow(2,e),1),1/2.2),p0=ex(pc(.005)),p1=ex(pc(.995));let dark=0,clip=0;
for(let i=0;i<256;i++){const v=ex(i/255);if(v<.18)dark+=Hh[i];if(v>.97)clip+=Hh[i]}dark/=n;clip/=n;
const cl=(x,a,b)=>Math.round(Math.max(a,Math.min(b,x)));
Object.assign(S.V,{exp:Math.round(e*100)/100,bl:cl(-Math.max(0,p0-.01)/.15*100,-100,0),wh:cl((1-Math.min(1,p1+.02))/.15*100,0,60),hl:clip>.02?cl(-(25+clip*400),-70,0):0,sh:dark>.25?cl((dark-.15)*150,0,60):0,con:p1-p0<.75?cl((.75-(p1-p0))*100,0,30):0,vib:15});
pname='';buildBody();queue();toast('Auto tone applied')}
function levelAngle(im){const c=canvasOf(im,512),W=c.width,H=c.height,d=c.getContext('2d').getImageData(0,0,W,H).data,g=new Float32Array(W*H);
for(let i=0;i<W*H;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];const B=new Float32Array(161);let tot=0;
for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){const i=y*W+x,gx=(g[i-W+1]+2*g[i+1]+g[i+W+1])-(g[i-W-1]+2*g[i-1]+g[i+W-1]),gy=(g[i+W-1]+2*g[i+W]+g[i+W+1])-(g[i-W-1]+2*g[i-W]+g[i-W+1]),m=Math.hypot(gx,gy);
if(m<80)continue;let a=Math.atan2(gy,gx)*180/Math.PI;a=((a%90)+90)%90;if(a>45)a-=90;tot+=m;if(Math.abs(a)<=20)B[Math.round((a+20)*4)]+=m}
let bi=0,bv=0;for(let i=4;i<157;i++){let s2=0;for(let k=-4;k<=4;k++)s2+=B[i+k];if(s2>bv){bv=s2;bi=i}}
if(!tot||bv/tot<.08)return null;let sw=0,sa=0;for(let k=-4;k<=4;k++){sw+=B[bi+k];sa+=B[bi+k]*((bi+k)/4-20)}const ang=-(sa/sw);
return Math.abs(ang)<.2||Math.abs(ang)>20?null:Math.round(ang*10)/10}
function autoLevel(){const v=IMG._lv===undefined?(IMG._lv=levelAngle(IMG)):IMG._lv;if(v===null){toast('No clear horizon or vertical lines found');return}S.crop.ang=v;buildBody();queue();showGrid(true);setTimeout(()=>showGrid(false),1300);toast('Leveled by '+v.toFixed(1)+'°')}
